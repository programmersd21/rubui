[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubui"
version = "1.0.0"
description = "A colorful 3D Rubik's Cube terminal UI with manual and auto modes."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "rubui contributors"}
]
keywords = ["rubik", "cube", "tui", "terminal", "puzzle", "3d"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "typer[all]>=0.9",
    "pyfiglet>=0.8",
    "kociemba>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
rubui = "rubui.main:main"

[project.urls]
Homepage = "https://github.com/programmersd21/rubui"
Repository = "https://github.com/programmersd21/rubui"
Issues = "https://github.com/programmersd21/rubui/issues"

[tool.setuptools.packages.find]
include = ["rubui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
